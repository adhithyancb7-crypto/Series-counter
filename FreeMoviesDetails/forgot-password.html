<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Free Series Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html">Free Series Details</a></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="films.html">Series</a>
            <a href="login.html">Log in</a>
            <a href="signup.html">Sign up</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-box">
                <h1>Reset Password</h1>
                <p class="auth-subtitle">Enter your account email and choose a new password.</p>
                <form id="resetPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <input type="email" id="resetEmail" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" minlength="8" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" minlength="8" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="auth-submit-btn">Reset Password</button>
                    <p id="resetMessage" class="auth-subtitle" role="status"></p>
                </form>
                <div class="auth-footer">
                    <p><a href="login.html">Back to login</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="css/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.userManager && userManager.currentUser) {
                window.location.href = "profile.html";
                return;
            }

            const form = document.getElementById("resetPasswordForm");
            const message = document.getElementById("resetMessage");

            form.addEventListener("submit", function (event) {
                event.preventDefault();

                const email = document.getElementById("resetEmail").value.trim();
                const newPassword = document.getElementById("newPassword").value;
                const confirmPassword = document.getElementById("confirmNewPassword").value;
                const users = JSON.parse(localStorage.getItem("users")) || {};
                const matchingEmail = Object.keys(users).find(key => key.toLowerCase() === email.toLowerCase());

                if (!matchingEmail) {
                    message.textContent = "No account was found for this email.";
                    return;
                }

                if (newPassword !== confirmPassword) {
                    message.textContent = "The passwords do not match.";
                    return;
                }

                users[matchingEmail].password = newPassword;
                localStorage.setItem("users", JSON.stringify(users));

                const currentUser = JSON.parse(localStorage.getItem("currentUser"));
                if (currentUser && currentUser.email.toLowerCase() === matchingEmail.toLowerCase()) {
                    localStorage.removeItem("currentUser");
                }

                message.textContent = "Password reset successfully. Redirecting to login...";
                form.reset();
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 700);
            });
        });
    </script>
</body>
</html>
